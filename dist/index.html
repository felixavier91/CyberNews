
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>This Week in Cyber</title>
        <style>
            :root {
                /* Refined color palette with more subtle yellows */
                --primary-yellow: #F5B041;
                --light-yellow: #FEF9E7;
                --dark-yellow: #9C640C;
                --accent-yellow: #FCF3CF;
                --background: #FFFFFF;
                --text-dark: #2C3E50;
                --text-light: #666666;
                --border-light: #E8E8E8;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                line-height: 1.6;
                max-width: 1800px;
                margin: 0 auto;
                padding: 20px;
                background: var(--background);
                color: var(--text-dark);
            }

            .container {
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            }

            .header {
                margin-bottom: 30px;
                padding: 25px 30px;
                position: relative;
                background: white;
                border-bottom: 3px solid var(--primary-yellow);
            }

            .header::after {
                content: '';
                position: absolute;
                bottom: -3px;
                left: 0;
                right: 0;
                height: 3px;
                background: linear-gradient(to right, var(--primary-yellow), var(--light-yellow));
            }

            .header h1 {
                display: flex;
                align-items: center;
                gap: 16px;
                color: var(--text-dark);
                margin: 0;
                font-size: 3.2em;
                font-weight: 900;
                letter-spacing: -1.5px;
                line-height: 1.1;
            }

            .header h1 .logo {
                flex: 0 0 auto;
                width: 1.1em;
                height: 1.1em;
                filter: drop-shadow(0 4px 6px rgba(156, 100, 12, 0.35));
            }

            .header h1 .accent {
                background: linear-gradient(90deg, var(--primary-yellow), var(--dark-yellow));
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                color: transparent;
            }

            .event-list {
                list-style: none;
                padding: 0;
            }

            .event-item {
                display: flex;
                align-items: center;
                gap: 24px;
                margin-bottom: 0;
                padding: 7px 20px;
                border-bottom: 1px solid var(--border-light);
                transition: all 0.2s ease;
                border-radius: 6px;
            }

            .event-item:hover {
                background-color: var(--light-yellow);
                transform: translateX(3px);
            }

            .event-title {
                color: var(--text-dark);
                text-decoration: none;
                font-weight: 400;
                display: block;
                flex: 1 1 auto;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                font-size: 1.1em;
            }

            .event-title:hover {
                color: var(--primary-yellow);
            }

            .event-meta {
                font-size: 0.9em;
                color: var(--text-light);
                flex: 0 0 auto;
                white-space: nowrap;
            }

            .last-updated {
                color: var(--text-light);
                font-size: 0.9em;
                margin-top: 15px;
                padding: 8px 12px;
                border-radius: 4px;
                display: inline-block;
                background: var(--light-yellow);
                border: 1px solid var(--primary-yellow);
            }

            .related-link {
                margin: 10px 0 0;
                font-size: 0.95em;
            }

            .related-link a {
                color: var(--dark-yellow);
                font-weight: 600;
                text-decoration: none;
            }

            .related-link a:hover {
                text-decoration: underline;
            }

            .disclaimer {
                color: var(--text-light);
                font-size: 0.85em;
                text-align: center;
                margin: 20px 0 0;
            }

            @media (max-width: 768px) {
                body {
                    padding: 10px;
                }
                .container {
                    padding: 15px;
                }
                .header {
                    padding: 20px;
                }
                .header h1 {
                    font-size: 2.2em;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>
                    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
                        <defs>
                            <linearGradient id="radar" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#F8C471"/>
                                <stop offset="1" stop-color="#D68910"/>
                            </linearGradient>
                        </defs>
                        <circle cx="32" cy="32" r="28" fill="#FEF9E7" stroke="url(#radar)" stroke-width="4"/>
                        <circle cx="32" cy="32" r="18" fill="none" stroke="url(#radar)" stroke-width="3" opacity="0.7"/>
                        <circle cx="32" cy="32" r="8" fill="none" stroke="url(#radar)" stroke-width="3" opacity="0.5"/>
                        <path d="M32 32 L32 4 A28 28 0 0 1 56.2 18 Z" fill="url(#radar)" opacity="0.45"/>
                        <line x1="32" y1="32" x2="56.2" y2="18" stroke="#D68910" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="44" cy="22" r="4" fill="#C0392B"/>
                        <circle cx="32" cy="32" r="3" fill="#9C640C"/>
                    </svg>
                    <span>This Week in <span class="accent">Cyber</span></span>
                </h1>
                <p class="last-updated">Last updated: 10-15 08:00 </p>
                <p class="related-link"><a href="https://historicalcyber.netlify.app/" target="_blank">Significant Cyber Incidents, 2003-2026</a></p>
            </div>
            <ul class="event-list">
                
            </ul>
            <p class="disclaimer">Prepared automatically by AI. The code is maintained by Felix Landa (Corporate ERM).</p>
        </div>
    </body>
    </html>
