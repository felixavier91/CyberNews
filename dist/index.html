
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>This Week in Cyber</title>
        <style>
            :root {
                /* Refined color palette with more subtle yellows */
                --primary-yellow: #F5B041;
                --light-yellow: #FEF9E7;
                --dark-yellow: #9C640C;
                --accent-yellow: #FCF3CF;
                --background: #FFFFFF;
                --text-dark: #2C3E50;
                --text-light: #666666;
                --border-light: #E8E8E8;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                line-height: 1.6;
                max-width: 900px;
                margin: 0 auto;
                padding: 20px;
                background: var(--background);
                color: var(--text-dark);
            }

            .container {
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            }

            .header {
                margin-bottom: 30px;
                padding: 25px 30px;
                position: relative;
                background: white;
                border-bottom: 3px solid var(--primary-yellow);
            }

            .header::after {
                content: '';
                position: absolute;
                bottom: -3px;
                left: 0;
                right: 0;
                height: 3px;
                background: linear-gradient(to right, var(--primary-yellow), var(--light-yellow));
            }

            .header h1 {
                color: var(--text-dark);
                margin: 0;
                font-size: 2.5em;
                font-weight: 700;
                letter-spacing: -0.5px;
            }

            .event-list {
                list-style: none;
                padding: 0;
            }

            .event-item {
                margin-bottom: 20px;
                padding: 20px;
                border-bottom: 1px solid var(--border-light);
                transition: all 0.2s ease;
                border-radius: 6px;
            }

            .event-item:hover {
                background-color: var(--light-yellow);
                transform: translateX(3px);
            }

            .event-title {
                color: var(--text-dark);
                text-decoration: none;
                font-weight: 500;
                display: block;
                margin-bottom: 8px;
                font-size: 1.1em;
            }

            .event-title:hover {
                color: var(--primary-yellow);
            }

            .event-meta {
                font-size: 0.9em;
                color: var(--text-light);
                margin-top: 8px;
                padding-left: 12px;
                border-left: 2px solid var(--primary-yellow);
            }

            .last-updated {
                color: var(--text-light);
                font-size: 0.9em;
                margin-top: 15px;
                padding: 8px 12px;
                border-radius: 4px;
                display: inline-block;
                background: var(--light-yellow);
                border: 1px solid var(--primary-yellow);
            }

            @media (max-width: 768px) {
                body {
                    padding: 10px;
                }
                .container {
                    padding: 15px;
                }
                .header {
                    padding: 20px;
                }
                .header h1 {
                    font-size: 2em;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>This Week in Cyber</h1>
                <p class="last-updated">Last updated: 2026-07-20 10:03 </p>
            </div>
            <ul class="event-list">
                
            </ul>
        </div>
    </body>
    </html>
