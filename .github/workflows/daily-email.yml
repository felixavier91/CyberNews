name: Daily Cyber Email

on:
  schedule:
    # GitHub's scheduler has been unreliable for this workflow: it didn't fire
    # at all on 2026-09-21, and fired ~5.5 hours late on 2026-09-22. So there
    # are two tries per season instead of one, ~15 minutes apart, and the gate
    # below accepts a fire any time during the day, not just around 8AM. The
    # "Skip if already sent" step guarantees only one tick actually emails.
    #
    # Primary: 7:55AM US/Eastern -> 11:55 UTC (EDT, summer) / 12:55 UTC (EST, winter)
    - cron: '55 11 * * *'
    - cron: '55 12 * * *'
    # Backup:  8:10AM US/Eastern -> 12:10 UTC (EDT, summer) / 13:10 UTC (EST, winter)
    - cron: '10 12 * * *'
    - cron: '10 13 * * *'
  workflow_dispatch:      # manual test run (sends immediately, ignores the dedupe check)

permissions:
  contents: write         # lets the refresh step commit the updated website page
  actions: read           # lets the dedupe step look at this workflow's past runs

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.6'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # On 2026-09-22, GitHub fired this workflow's schedule ~5.5 hours late
      # (~1:30PM Eastern instead of ~8AM). A tight morning-only gate here had
      # been silently swallowing that: the run "succeeded" but never reached
      # the Send step. So this only rules out the middle of the night, in
      # case a schedule tick ever fires wildly early instead of late. Any
      # daytime fire, however late, still sends - once per day, via dedupe
      # below. Manual runs always continue regardless of the clock.
      - name: Check whether this run should send
        id: gate
        run: |
          h=$(TZ=America/New_York date +%H); m=$(TZ=America/New_York date +%M)
          mins=$((10#$h * 60 + 10#$m))
          echo "Eastern time is $h:$m"
          if [[ "${{ github.event_name }}" != "schedule" ]] || (( mins >= 300 && mins < 1380 )); then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
          fi

      # If the primary tick already sent today's email, the backup tick stops here.
      - name: Skip if already sent in the last 20 hours
        id: dedupe
        if: steps.gate.outputs.go == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh run list --workflow=daily-email.yml --json conclusion,event,createdAt \
            -q "[.[] | select(.event==\"schedule\" and .conclusion==\"success\" and .createdAt >= \"$since\")] | length")
          echo "Successful scheduled sends in the last 20h: $count"
          if [[ "$count" -gt 0 ]]; then
            echo "go=false" >> $GITHUB_OUTPUT
          else
            echo "go=true" >> $GITHUB_OUTPUT
          fi

      # Prep 1: refresh the website with the latest news, before the email.
      # If this step fails, the email is still sent.
      - name: Refresh website
        if: steps.gate.outputs.go == 'true' && steps.dedupe.outputs.go != 'false'
        continue-on-error: true
        run: |
          python main.py
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            git add dist/
            git commit -m "Update This Week in Cyber feed before email - $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase
            git push
          fi
        env:
          TZ: 'America/New_York'

      # Prep 2: on the primary tick, wait until just before 8:00AM Eastern (5
      # seconds early, so the feed fetch and mail hand-off land at 8:00). If
      # it's already past that time (a late start, or this is the backup
      # tick), this does nothing and the email goes out right away.
      - name: Wait until 8:00AM Eastern
        if: steps.gate.outputs.go == 'true' && steps.dedupe.outputs.go != 'false' && github.event_name == 'schedule'
        run: |
          target=$(( $(TZ=America/New_York date -d "08:00" +%s) - 5 ))
          now=$(date +%s)
          if (( now < target )); then
            echo "Waiting $((target - now))s until 8:00AM Eastern"
            sleep $((target - now))
          else
            echo "Already past 8:00AM Eastern; sending now"
          fi

      # Fetches the news again at send time, so the email has the very latest.
      - name: Send email
        if: steps.gate.outputs.go == 'true' && steps.dedupe.outputs.go != 'false'
        run: python send_email.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
