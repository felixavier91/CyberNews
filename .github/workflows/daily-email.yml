name: Daily Cyber Email

on:
  schedule:
    # Starts at 7:50AM US/Eastern: 11:50 UTC in summer (EDT), 12:50 UTC in winter (EST).
    # Both are scheduled; the gate step below lets only the right one continue.
    # The job does its prep first, then waits until 8:00AM Eastern to send.
    - cron: '50 11 * * *'
    - cron: '50 12 * * *'
  workflow_dispatch:      # manual test run (sends immediately, no waiting)

permissions:
  contents: write         # lets the refresh step commit the updated website page

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.6'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Scheduled runs: continue only if the Eastern clock reads 7:20-8:40AM, so
      # exactly one of the two cron entries goes ahead (allows for GitHub start
      # delays; a late start still sends, just later). Manual runs always continue.
      - name: Check whether this run should send
        id: gate
        run: |
          h=$(TZ=America/New_York date +%H); m=$(TZ=America/New_York date +%M)
          mins=$((10#$h * 60 + 10#$m))
          echo "Eastern time is $h:$m"
          if [[ "${{ github.event_name }}" != "schedule" ]] || (( mins >= 440 && mins < 520 )); then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
          fi

      # Prep 1: refresh the website with the latest news, before the email.
      # If this step fails, the email is still sent.
      - name: Refresh website
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: |
          python main.py
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            git add dist/
            git commit -m "Update This Week in Cyber feed before email - $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase
            git push
          fi
        env:
          TZ: 'America/New_York'

      # Prep 2: wait until just before 8:00AM Eastern (5 seconds early, so the
      # feed fetch and mail hand-off land at 8:00). If it's already past that
      # time because of a late start, this does nothing and the email goes now.
      - name: Wait until 8:00AM Eastern
        if: steps.gate.outputs.go == 'true' && github.event_name == 'schedule'
        run: |
          target=$(( $(TZ=America/New_York date -d "08:00" +%s) - 5 ))
          now=$(date +%s)
          if (( now < target )); then
            echo "Waiting $((target - now))s until 8:00AM Eastern"
            sleep $((target - now))
          else
            echo "Already past 8:00AM Eastern; sending now"
          fi

      # Fetches the news again at send time, so the email has the very latest.
      - name: Send email
        if: steps.gate.outputs.go == 'true'
        run: python send_email.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
