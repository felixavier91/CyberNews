name: Daily Cyber Email

on:
  schedule:
    # 8AM US/Eastern is 12:00 UTC in summer (EDT) and 13:00 UTC in winter (EST).
    # Run at both; send_email.py only sends when the Eastern hour is 8.
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:      # manual test run (skips the 8AM check)

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.6'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send email
        run: python send_email.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Only enforce the 8AM check on scheduled runs
          ONLY_AT_HOUR: ${{ github.event_name == 'schedule' && '8' || '' }}
