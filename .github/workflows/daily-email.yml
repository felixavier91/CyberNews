name: Daily Cyber Email

on:
  schedule:
    # Aimed at 8:30AM US/Eastern, the middle of the 8-10AM window this needs to
    # land in. One entry per season (cron doesn't know about daylight saving),
    # each firing once a day - same shape as update-feed.yml's single entry,
    # which has always fired reliably on this repo. An earlier version of this
    # file packed 4 entries into a 75-minute span as "retries"; that version
    # fired 5.5 hours late, which points at clustering entries close together
    # as the likely cause, not GitHub being generally unreliable.
    - cron: '30 12 * * *'   # 8:30AM EDT (summer)
    - cron: '30 13 * * *'   # 8:30AM EST (winter)
  workflow_dispatch:        # manual test run (sends immediately)

permissions:
  contents: write         # lets the refresh step commit the updated website page
  actions: read           # lets the dedupe step look at this workflow's past runs

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.6'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Only the entry matching the current season lands in this window;
      # the other one (wrong season) is filtered out here. Manual runs
      # always continue regardless of the clock.
      - name: Check whether this run should send
        id: gate
        run: |
          h=$(TZ=America/New_York date +%H); m=$(TZ=America/New_York date +%M)
          mins=$((10#$h * 60 + 10#$m))
          echo "Eastern time is $h:$m"
          if [[ "${{ github.event_name }}" != "schedule" ]] || (( mins >= 420 && mins < 660 )); then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
          fi

      # Cheap insurance against sending twice on the same day (e.g. a stray
      # extra fire around a DST changeover).
      - name: Skip if already sent in the last 20 hours
        id: dedupe
        if: steps.gate.outputs.go == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh run list --workflow=daily-email.yml --json conclusion,event,createdAt \
            -q "[.[] | select(.event==\"schedule\" and .conclusion==\"success\" and .createdAt >= \"$since\")] | length")
          echo "Successful scheduled sends in the last 20h: $count"
          if [[ "$count" -gt 0 ]]; then
            echo "go=false" >> $GITHUB_OUTPUT
          else
            echo "go=true" >> $GITHUB_OUTPUT
          fi

      # Refresh the website with the latest news before the email. If this
      # step fails, the email is still sent.
      - name: Refresh website
        if: steps.gate.outputs.go == 'true' && steps.dedupe.outputs.go != 'false'
        continue-on-error: true
        run: |
          python main.py
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            git add dist/
            git commit -m "Update This Week in Cyber feed before email - $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase
            git push
          fi
        env:
          TZ: 'America/New_York'

      # Fetches the news again at send time, so the email has the very latest.
      - name: Send email
        if: steps.gate.outputs.go == 'true' && steps.dedupe.outputs.go != 'false'
        run: python send_email.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
