# Name of our automated process
name: Update Cyber Security Feed

# When should this process run?
on:
  schedule:
    - cron: '0 */6 * * *'  # This means "run every 6 hours"
  workflow_dispatch:        # This lets us run it manually if needed
  push:
    branches:
      - main              # Also run when we push changes to main branch

# What tasks should be performed?
jobs:
  update:
    runs-on: ubuntu-latest    # Use a Linux computer to run our code
    name: Update This Week in Cyber Feed
    
    steps:
      # Step 1: Get our code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.6'  # Using your Python version
          cache: 'pip'
      
      # Step 3: Install our project's requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step 4: Set up Git with a bot identity
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
      
      # Step 5: Run our Python script
      - name: Generate updated feed
        run: python main.py
        env:
          TZ: 'America/New_York'
      
      # Step 6: Check if we have any new updates
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      # Step 7: If we have updates, save them
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add dist/
          git commit -m "Update This Week in Cyber feed - $(date +'%Y-%m-%d %H:%M:%S')"
          git push

      # Step 8: This workflow's schedule is the one that's proven reliable
      # (the separate Cyber Digest Email workflow's own schedule never fired,
      # across many tests). So the daily email piggybacks on this run instead.
      #
      # This workflow's actual fire times drift around a lot (observed: 21:43,
      # 03:30, 11:00, 10:50, 16:10 UTC - nowhere near clean 00/06/12/18), so
      # gating on a specific clock hour silently skips real fires that land
      # outside it (that's exactly what happened at 16:10 UTC today). Instead,
      # this tracks how long it's been since the last successful send and
      # requires a 9-hour gap, which - given ticks land roughly every 5-7
      # hours - naturally settles into about 2 sends a day without needing to
      # predict which clock hour GitHub will actually fire at.
      - name: Check time since last email
        id: email_gate
        if: github.event_name == 'schedule'
        run: |
          marker=.github/last_email_sent.txt
          if [[ -f "$marker" ]]; then
            last=$(cat "$marker")
            hours_since=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 3600 ))
            echo "Last email sent $last ($hours_since hours ago)"
          else
            hours_since=999
            echo "No record of a previous email"
          fi
          if (( hours_since >= 9 )); then
            echo "send=true" >> $GITHUB_OUTPUT
          else
            echo "send=false" >> $GITHUB_OUTPUT
          fi

      - name: Send digest email
        if: github.event_name == 'schedule' && steps.email_gate.outputs.send == 'true'
        run: |
          python send_email.py
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last_email_sent.txt
          git add .github/last_email_sent.txt
          git commit -m "Record last email send time - $(date -u +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase
          git push
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
