# Name of our automated process
name: Update Cyber Security Feed

# When should this process run?
on:
  schedule:
    - cron: '0 */6 * * *'  # This means "run every 6 hours"
  workflow_dispatch:        # This lets us run it manually if needed
  push:
    branches:
      - main              # Also run when we push changes to main branch

# What tasks should be performed?
jobs:
  update:
    runs-on: ubuntu-latest    # Use a Linux computer to run our code
    name: Update This Week in Cyber Feed
    
    steps:
      # Step 1: Get our code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.6'  # Using your Python version
          cache: 'pip'
      
      # Step 3: Install our project's requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step 4: Set up Git with a bot identity
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
      
      # Step 5: Run our Python script
      - name: Generate updated feed
        run: python main.py
        env:
          TZ: 'America/New_York'
      
      # Step 6: Check if we have any new updates
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      # Step 7: If we have updates, save them
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add dist/
          git commit -m "Update This Week in Cyber feed - $(date +'%Y-%m-%d %H:%M:%S')"
          git push

      # Step 8: This workflow's schedule is the one that's proven reliable
      # (the separate Cyber Digest Email workflow's own schedule never fired,
      # across many tests). So the daily email piggybacks on this run instead.
      # Of the 4 daily ticks (00/06/12/18 UTC), 12:00 UTC lands at 8AM EDT /
      # 7AM EST (morning) and 18:00 UTC lands at 2PM EDT / 1PM EST (afternoon)
      # - this only fires on those two, and only for genuine schedule runs
      # (not the push-triggered runs from every commit to main).
      - name: Check whether this is a morning or afternoon run
        id: email_gate
        if: github.event_name == 'schedule'
        run: |
          h=$(TZ=America/New_York date +%H)
          echo "Eastern hour is $h"
          if [[ "$h" == "07" || "$h" == "08" || "$h" == "13" || "$h" == "14" ]]; then
            echo "send=true" >> $GITHUB_OUTPUT
          else
            echo "send=false" >> $GITHUB_OUTPUT
          fi

      - name: Send digest email
        if: github.event_name == 'schedule' && steps.email_gate.outputs.send == 'true'
        run: python send_email.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
