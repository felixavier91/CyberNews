name: Cyber Digest Email

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes - kept as a control group: this
    # never fired once in prior testing, so once the external trigger is live
    # (which shows up as workflow_dispatch, not schedule), comparing the two
    # confirms the external trigger is what's actually working.
  workflow_dispatch:

permissions:
  contents: write         # lets the refresh step commit the updated website page

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.6'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh website
        run: |
          python main.py
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            git add dist/
            git commit -m "Update This Week in Cyber feed before email - $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase
            git push
          fi
        env:
          TZ: 'America/New_York'

      - name: Send email
        run: python send_email.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
